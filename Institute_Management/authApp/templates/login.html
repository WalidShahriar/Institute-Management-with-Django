{% extends 'master/base.html' %}

{% load crispy_forms_tags %}

{% block title %}
    Login
{% endblock title %}


{% block body %}

    <h1 class="my-5">Login</h1>

    <form method="POST">
        {% csrf_token %}

        {{form_data | crispy}}

        <div class="mb-3">
            <button type="submit" class="btn btn-primary form-control">Login</button>
        </div>
    </form>

{% endblock body %}
